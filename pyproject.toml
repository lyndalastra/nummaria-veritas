[project]
name = "nummaria-veritas"
version = "0.1.0"
description = "An evidence-integrity framework for verifying and correcting financial AI claims."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.18.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "scipy-stubs>=1.18.1.0",
    "types-pyyaml>=6.0.12.20260815",
]

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
]
ignore_missing_imports = true